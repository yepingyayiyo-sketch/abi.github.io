<script>
let soundOn=true;
const TAMBAHAN = 1500;

const paket={
  "Free Fire":[
    ["5 DM",1000+TAMBAHAN],
    ["10 DM",2000+TAMBAHAN],
    ["20 DM",4000+TAMBAHAN],
    ["50 DM",8000+TAMBAHAN],
    ["70 DM",10000+TAMBAHAN],
    ["140 DM",20000+TAMBAHAN]
  ],
  "Mobile Legends":[
    ["86 Diamonds",20000+TAMBAHAN],
    ["172 Diamonds",40000+TAMBAHAN],
    ["257 Diamonds",60000+TAMBAHAN]
  ],
  "PUBG Mobile":[
    ["60 UC",15000+TAMBAHAN],
    ["180 UC",45000+TAMBAHAN]
  ],
  "Genshin Impact":[
    ["60 Genesis",15000+TAMBAHAN],
    ["300 Genesis",75000+TAMBAHAN]
  ],
  "Roblox":[
    ["80 Robux",15000+TAMBAHAN],
    ["400 Robux",75000+TAMBAHAN],
    ["800 Robux",150000+TAMBAHAN],
    ["1700 Robux",300000+TAMBAHAN]
  ]
};

function renderPaket(){
  let g=document.getElementById("game").value;
  let area=document.getElementById("paketArea");
  area.innerHTML="";
  paket[g].forEach(p=>{
    area.innerHTML+=`
    <div class="card">
      <h2>${p[0]}</h2>
      <div class="price">Rp${p[1].toLocaleString("id-ID")}</div>
      <button onclick="beli('${p[0]}','${p[1]}')">Beli</button>
    </div>`;
  });
}

function bocilKetawa(){
  if(!soundOn) return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  [0,0.12,0.24].forEach((t,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="square";
    o.frequency.setValueAtTime(800+i*150,ctx.currentTime+t);
    g.gain.setValueAtTime(.25,ctx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.1);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime+t);
    o.stop(ctx.currentTime+t+.12);
  });
}

function cekGame(){
  let g=document.getElementById("game").value;
  document.getElementById("serverML").style.display =
    g==="Mobile Legends"?"block":"none";
  renderPaket();
}

function beli(paketNama,harga){
  bocilKetawa();
  let id=document.getElementById("playerId").value;
  let g=document.getElementById("game").value;
  let s=document.getElementById("serverML").value;
  let pay=document.getElementById("payment").value;

  if(!id){alert("Isi ID dulu woy");return;}
  if(g==="Mobile Legends"&&!s){alert("Server ML jangan kosong");return;}

  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{
    let txt=
      "TOP UP GAME%0A"+
      "Game: "+g+"%0A"+
      "ID: "+id+
      (g==="Mobile Legends"?"%0AServer: "+s:"")+
      "%0APaket: "+paketNama+
      "%0AHarga: Rp"+harga+
      "%0APembayaran: "+pay;

    location.href="https://wa.me/6289525470774?text="+txt;
  },1200);
}

function toggleTheme(){document.body.classList.toggle("light")}
function toggleSound(){soundOn=!soundOn}

renderPaket();
</script>
