</html><script>
function bocilKetawa(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const times = [0, 0.12, 0.24, 0.36]; // ketawa patah-patah
  times.forEach((t, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(900 + i*120, ctx.currentTime + t);
    g.gain.setValueAtTime(0.25, ctx.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.1);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime + t);
    o.stop(ctx.currentTime + t + 0.12);
  });
}

function beli(paket,harga){
