<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Top Up Game — All In One</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;--card:#151515;--text:#fff;--acc1:#ff9800;--acc2:#ff5722
}
.light{
  --bg:#f5f5f5;--card:#fff;--text:#111
}
*{box-sizing:border-box;font-family:Poppins,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);text-align:center}
header{padding:26px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#000}
.container{padding:18px}
input,select{
  width:100%;max-width:420px;padding:12px;border-radius:12px;
  border:none;margin-bottom:12px;font-size:15px
}
.card{
  background:var(--card);border:2px solid var(--acc1);
  border-radius:18px;padding:16px;margin:12px auto;max-width:420px;
  box-shadow:0 0 18px rgba(255,152,0,.25)
}
.card h2{margin:0;color:var(--acc1)}
.price{font-size:18px;font-weight:700;margin:6px 0}
button{
  width:100%;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));
  font-weight:800;font-size:15px;cursor:pointer
}
.topbar{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.small{padding:8px 12px;font-size:12px;border-radius:999px}
footer{font-size:12px;color:#aaa;padding:16px}
#loading{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:none;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:var(--acc1);z-index:9
}
#serverML{display:none}
</style>
</head>

<body>

<!-- BANNER UPDATE -->
<div style="
  background:linear-gradient(135deg,#ff9800,#ff5722);
  color:#000;
  padding:12px;
  font-weight:800;
">
  🚀 UPDATE TOKO — BUKAN HANYA FREE FIRE 🔥  
  SEKARANG <b>MULTI GAME</b> 🎮 (FF • ML • PUBG • GENSHIN • <b>ROBLOX</b>)
</div>

<header>
<h1>🔥 TOP UP GAME 🔥</h1>
<p>All In One • Auto Paket • Versi Gilak</p>
</header>

<div class="container">

<div class="topbar">
  <button class="small" onclick="toggleTheme()">🌗 Theme</button>
  <button class="small" onclick="toggleSound()">🔊 Sound</button>
</div>

<select id="game" onchange="cekGame()">
  <option value="Free Fire">🔥 Free Fire</option>
  <option value="Mobile Legends">🛡️ Mobile Legends</option>
  <option value="PUBG Mobile">🎯 PUBG Mobile</option>
  <option value="Genshin Impact">⚔️ Genshin Impact</option>
  <option value="Roblox">🟥 Roblox</option>
</select>

<input id="playerId" placeholder="Masukkan ID / Username Player">
<input id="serverML" placeholder="Server ML (contoh: 1234)">

<select id="payment">
  <option value="QRIS">💳 QRIS</option>
  <option value="DANA">💙 DANA</option>
  <option value="OVO">💜 OVO</option>
  <option value="GoPay">💚 GoPay</option>
</select>

<div id="paketArea"></div>

</div>

<footer>
© 2026 • Multi Game Top Up <br>
Abi mode iblis 🗿🔥
</footer>

<div id="loading">⏳ Diproses...</div>

<script>
let soundOn=true;

const paket={
  "Free Fire":[
    ["5 DM",1000],["10 DM",2000],["20 DM",4000],
    ["50 DM",8000],["70 DM",10000],["140 DM",20000]
  ],
  "Mobile Legends":[
    ["86 Diamonds",20000],["172 Diamonds",40000],["257 Diamonds",60000]
  ],
  "PUBG Mobile":[
    ["60 UC",15000],["180 UC",45000]
  ],
  "Genshin Impact":[
    ["60 Genesis",15000],["300 Genesis",75000]
  ],
  "Roblox":[
    ["80 Robux",18000],
    ["400 Robux",75000],
    ["800 Robux",150000],
    ["1700 Robux",300000]
  ]
};

function renderPaket(){
  let g=document.getElementById("game").value;
  let area=document.getElementById("paketArea");
  area.innerHTML="";
  paket[g].forEach(p=>{
    area.innerHTML+=`
    <div class="card">
      <h2>${p[0]}</h2>
      <div class="price">Rp${p[1].toLocaleString()}</div>
      <button onclick="beli('${p[0]}','${p[1]}')">Beli</button>
    </div>`;
  });
}

function bocilKetawa(){
  if(!soundOn) return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  [0,0.12,0.24].forEach((t,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="square";o.frequency.setValueAtTime(800+i*150,ctx.currentTime+t);
    g.gain.setValueAtTime(.25,ctx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.1);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.12);
  });
}

function cekGame(){
  let g=document.getElementById("game").value;
  document.getElementById("serverML").style.display =
    g==="Mobile Legends"?"block":"none";
  renderPaket();
}

function beli(paketNama,harga){
  bocilKetawa();
  let id=document.getElementById("playerId").value;
  let g=document.getElementById("game").value;
  let s=document.getElementById("serverML").value;
  let pay=document.getElementById("payment").value;

  if(!id){alert("Isi ID dulu woy");return;}
  if(g==="Mobile Legends"&&!s){alert("Server ML jangan kosong");return;}

  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{
    let txt=
      "TOP UP GAME%0A"+
      "Game: "+g+"%0A"+
      "ID: "+id+
      (g==="Mobile Legends"?"%0AServer: "+s:"")+
      "%0APaket: "+paketNama+
      "%0AHarga: Rp"+harga+
      "%0APembayaran: "+pay;

    location.href="https://wa.me/6289525470774?text="+txt;
  },1200);
}

function toggleTheme(){document.body.classList.toggle("light")}
function toggleSound(){soundOn=!soundOn}

renderPaket();
</script>

</body>
</html>
