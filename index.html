<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Top Up Game — All In One</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;--card:#151515;--text:#fff;--acc1:#ff9800;--acc2:#ff5722
}
.light{--bg:#f5f5f5;--card:#fff;--text:#111}
*{box-sizing:border-box;font-family:Poppins,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);text-align:center}
header{padding:26px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#000}
.container{padding:18px}
button{
  width:100%;max-width:420px;
  padding:14px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));
  font-weight:800;font-size:15px;cursor:pointer;margin:6px auto
}
.card{
  background:var(--card);border:2px solid var(--acc1);
  border-radius:18px;padding:16px;margin:12px auto;max-width:420px;
  box-shadow:0 0 18px rgba(255,152,0,.25)
}
.price{font-size:18px;font-weight:700;margin:6px 0}
input,select{
  width:100%;max-width:420px;
  padding:12px;border-radius:12px;
  border:none;margin-bottom:12px;font-size:15px
}
#formArea{display:none}
#serverML{display:none}
#loading{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:none;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:var(--acc1)
}
footer{font-size:12px;color:#aaa;padding:16px}
</style>
</head>

<body>

<!-- BANNER -->
<div style="background:linear-gradient(135deg,#ff9800,#ff5722);color:#000;padding:12px;font-weight:800">
🚀 UPDATE TOKO — MULTI GAME 🎮
</div>

<header>
<h1>🔥 TOP UP GAME 🔥</h1>
<p>Pilih Game → Masukin ID → Pilih Paket</p>
</header>

<div class="container">

<!-- PILIH GAME -->
<button onclick="pilihGame('Free Fire')">🔥 Free Fire</button>
<button onclick="pilihGame('Mobile Legends')">🛡️ Mobile Legends</button>
<button onclick="pilihGame('PUBG Mobile')">🎯 PUBG Mobile</button>
<button onclick="pilihGame('Genshin Impact')">⚔️ Genshin Impact</button>
<button onclick="pilihGame('Roblox')">🟥 Roblox</button>

<!-- FORM -->
<div id="formArea">

  <input id="playerId" placeholder="Masukkan ID / Username Player">
  <input id="serverML" placeholder="Server ML (contoh: 1234)">

  <select id="payment">
    <option>QRIS</option>
    <option>DANA</option>
    <option>OVO</option>
    <option>GoPay</option>
  </select>

  <div id="paketArea"></div>
</div>

</div>

<footer>
© 2026 • Abi mode iblis 🗿🔥
</footer>

<div id="loading">⏳ Diproses...</div>

<script>
let gameDipilih="";
const paket={
  "Free Fire":[["5 DM",1000],["10 DM",2000],["20 DM",4000],["50 DM",8000]],
  "Mobile Legends":[["86 Diamonds",20000],["172 Diamonds",40000]],
  "PUBG Mobile":[["60 UC",15000]],
  "Genshin Impact":[["60 Genesis",15000]],
  "Roblox":[["80 Robux",15000]]
};

function pilihGame(game){
  gameDipilih=game;
  document.getElementById("formArea").style.display="block";
  document.getElementById("serverML").style.display =
    game==="Mobile Legends"?"block":"none";
  renderPaket();
  document.getElementById("playerId").focus();
}

function renderPaket(){
  const area=document.getElementById("paketArea");
  area.innerHTML="";
  paket[gameDipilih].forEach(p=>{
    area.innerHTML+=`
      <div class="card">
        <h3>${p[0]}</h3>
        <div class="price">Rp${p[1].toLocaleString()}</div>
        <button onclick="beli('${p[0]}',${p[1]})">Beli</button>
      </div>`;
  });
}

function beli(paketNama,harga){
  const id=playerId.value;
  const srv=serverML.value;
  const pay=payment.value;
  if(!id) return alert("Isi ID dulu");
  if(gameDipilih==="Mobile Legends"&&!srv) return alert("Isi Server ML");

  loading.style.display="flex";

  const msg=
`TOP UP GAME
Game: ${gameDipilih}
ID: ${id}${gameDipilih==="Mobile Legends"?"\nServer: "+srv:""}
Paket: ${paketNama}
Harga: Rp${harga}
Pembayaran: ${pay}`;

  setTimeout(()=>{
    location.href="https://wa.me/6289525470774?text="+encodeURIComponent(msg);
  },1200);
}
</script>

</body>
</html>
