<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
        url("bg-ff.jpg") no-repeat center/cover;
      min-height: 100vh;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 80px;
      margin: 10px auto;
    }

    .banner {
      width: 100%;
      border-radius: 15px;
      margin: 15px 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    h1 {
      margin: 10px 0 5px;
    }

    .tagline {
      color: #ccc;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(0,0,0,0.65);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
      font-size: 16px;
    }

    li {
      margin: 8px 0;
    }

    input {
      width: 90%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin: 8px 0;
      font-size: 16px;
    }

    .wa-btn {
      background: #25D366;
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    .floating-wa {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      color: white;
      padding: 16px 18px;
      border-radius: 50%;
      font-size: 24px;
      text-decoration: none;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
    }

    footer {
      font-size: 12px;
      color: #aaa;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <img src="logo-ff.png" class="logo" alt="Logo">

    <!-- BANNER -->
    <img src="ff-banner.jpg" class="banner" alt="Free Fire">

    <h1>🔥 TOP UP DIAMOND FF 🔥</h1>

    <div class="card">

    </div>

    <!-- PAKET -->
    <div class="card">
      <h2>Paket Diamond</h2>
      <ul>
        <li>💎 50 Diamond — Rp8.000</li>

        <li>💎 210 Diamond — Rp30.000</li>

      © 2026 Abi Top Up FF

  <!-- WHATSAPP NGAMBANG -->
  <a href="https://wa.me/6289525470774" class="floating-wa">💬</a>

</body>
</html>
